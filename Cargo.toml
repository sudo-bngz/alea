[package]
name = "alea"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "alea"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
# The command line: parallel rendering, WAV/MP4 output and OS randomness.
native = ["dep:rayon", "dep:hound", "rand/thread_rng"]

[dependencies]
ab_glyph = "0.2"
hound = { version = "3.5", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libm = "0.2"
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = { version = "0.9", default-features = false, features = ["std"] }
rayon = { version = "1", optional = true }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
