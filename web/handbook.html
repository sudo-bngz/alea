<title>alea Handbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Silkscreen&display=swap">
<style>
/* Layout: a manual for a machine. Black, monospace, thin grey rules; an index on the left, one column on the right,
   numbered sections with a tag, controls and table heads in capitals. The code in the colours of a terminal
   (keywords violet, functions blue, strings olive, numbers amber, named arguments orange, x y t cyan),
   chance in red; the titles take the same colours. */
:root {
  --paper: #000;
  --page: #000;
  --ink: #d6d6d6;
  --bright: #fff;
  --muted: #8f8f8f;
  --dim: #5e5e5e;
  --line: #2c2c2c;
  --frame: #5a5a5a;
  --accent: #ff4b2b;          /* the red of chance: ~ in the code */
  --code: #0b0b0b;
  --syn-kw: #c397d8; --syn-prim: #7fb3d5; --syn-str: #b5bd68; --syn-num: #f0c674;
  --syn-com: #6f7480; --syn-call: #ffffff; --syn-param: #de935f; --syn-var: #8abeb7;
  --title: #f0c674;           /* the page's name and chapter tags: amber */
  --tag-ref: #7fb3d5;         /* the reference's tags: blue */
  --sub: #b5bd68;             /* sub-headings: olive, after a // */
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-key: "Silkscreen", "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.85 var(--f-mono); letter-spacing: 0.02em; }
a { color: var(--syn-prim); text-decoration: underline dotted var(--syn-prim); text-underline-offset: 3px; }
a:hover { background: var(--syn-prim); color: var(--paper); text-decoration: none; }
:focus-visible { outline: 2px solid var(--bright); outline-offset: 2px; }
::selection { background: var(--bright); color: var(--paper); }

.shell {
  display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 56px;
  max-width: 1240px; margin: 0 auto;
  padding-block: 32px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── index ── */
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; max-height: calc(100vh - 40px); overflow: auto; padding-right: 8px; scrollbar-color: var(--frame) transparent; }
.mark { font: 400 20px/1 var(--f-key); letter-spacing: .16em; text-transform: uppercase; color: var(--bright); margin: 0 0 10px; }
.mark b { font: 600 22px/1 var(--f-mono); letter-spacing: 0; color: var(--accent); margin-right: 4px; }
.sub { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin: 0 0 26px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.side ul { list-style: none; margin: 0 0 22px; padding: 0; }
.side li a { display: block; color: var(--ink); text-decoration: none; font-size: 12.5px; line-height: 1.45; padding: 4px 8px; border-left: 2px solid transparent; }
.side li a:hover { background: none; color: var(--bright); border-left-color: var(--syn-prim); }
.side li a.here { color: var(--paper); background: var(--title); border-left-color: var(--title); }
.nav-head { margin: 0 0 8px; font: 400 11px/1 var(--f-key); letter-spacing: .16em; text-transform: uppercase; }
.nav-head a { color: var(--syn-prim); text-decoration: none; }
.nav-head a:hover { background: none; color: var(--bright); }
details.mobile-nav { display: none; }

/* ── page ── */
main { min-width: 0; }
.doc { padding: 0 0 40px; counter-reset: sec; }
.doc + .doc { margin-top: 40px; border-top: 2px solid var(--line); }
.doc > * { max-width: 76ch; }
.doc > pre, .doc > table, .doc > .table-wrap, .doc > figure { max-width: none; }
h1, h2, h3 { font-weight: 400; color: var(--bright); text-transform: uppercase; text-wrap: balance; line-height: 1.3; scroll-margin-top: 16px; }
h1 { font: 400 clamp(24px, 3.2vw, 34px)/1.2 var(--f-key); letter-spacing: .12em; margin: 40px 0 18px; color: var(--title); }
h1::before { content: "> "; color: var(--accent); }
h2 { display: flex; align-items: center; gap: 18px; font-size: clamp(16px, 1.6vw, 19px); letter-spacing: .1em; margin: 56px 0 18px; padding-top: 28px; border-top: 2px solid var(--line); counter-increment: sec; }
/* the tag: the guide's chapters carry their own number, the reference's sections are counted */
#reference h2::before { content: counter(sec, decimal-leading-zero); }
#reference h2::before, h2 .num { flex: none; display: grid; place-items: center; min-width: 42px; height: 42px; padding: 0 6px; background: var(--title); color: var(--paper); font: 600 15px/1 var(--f-mono); letter-spacing: .04em; }
#reference h2::before { background: var(--tag-ref); }
h3 { font-size: 14px; letter-spacing: .12em; margin: 34px 0 10px; color: var(--sub); }
h3::before { content: "// "; color: var(--syn-com); }
hr { display: none; }
p, li { text-wrap: pretty; }
strong { color: var(--bright); font-weight: 600; }
blockquote { margin: 0 0 12px; padding: 10px 14px; color: var(--muted); font-size: 13px; border: 2px solid var(--frame); }
blockquote p { margin: 0; }
blockquote code { color: var(--bright); }
code { font: 0.9em var(--f-mono); color: var(--syn-num); background: #12110d; padding: 0.05em 0.35em; border: 1px solid #2e2a1e; }
pre { background: var(--code); border: 1px solid var(--line); border-left: 3px solid var(--syn-prim); padding: 14px 18px; overflow-x: auto; font: 13px/1.7 var(--f-mono); letter-spacing: 0; tab-size: 2; }
pre code { background: none; padding: 0; border: 0; font: inherit; color: var(--ink); }
td code, th code { white-space: nowrap; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 16px 0; display: block; overflow-x: auto; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px 10px 0; border-bottom: 1px solid var(--line); }
th { font: 400 10.5px/1.4 var(--f-key); letter-spacing: .14em; text-transform: uppercase; color: var(--syn-param); border-bottom: 2px solid var(--line); }
td code { white-space: nowrap; }
figure.strip { margin: 8px 0 20px; display: flex; flex-wrap: wrap; gap: 10px; }
figure.strip img { width: 150px; height: 150px; max-width: calc(50% - 5px); height: auto; aspect-ratio: 1; padding: 4px; border: 1px solid var(--frame); background: var(--paper); }
figure.strip figcaption { flex-basis: 100%; font-size: 11.5px; color: var(--dim); }

.k { color: var(--syn-kw); font-weight: 600; } .p { color: var(--syn-prim); } .d { color: var(--accent); font-weight: 600; }
.s { color: var(--syn-str); } .n { color: var(--syn-num); } .c { color: var(--syn-com); font-style: italic; }
.w { color: var(--syn-call); text-decoration: underline 1px var(--dim); text-underline-offset: 3px; } .a { color: var(--syn-param); font-style: italic; } .v { color: var(--syn-var); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .side { display: none; }
  details.mobile-nav { display: block; border: 2px solid var(--frame); padding: 10px 14px; }
  details.mobile-nav summary { cursor: pointer; font: 400 12px/1.6 var(--f-key); letter-spacing: .14em; text-transform: uppercase; color: var(--bright); }
  details.mobile-nav ul { list-style: none; padding: 0; margin: 8px 0 12px; columns: 2; column-gap: 16px; }
  details.mobile-nav li a { display: block; padding: 3px 0; font-size: 12.5px; color: var(--ink); text-decoration: none; }
  h2 { gap: 12px; }
  #reference h2::before, h2 .num { min-width: 36px; height: 36px; font-size: 13px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="shell">
  <nav class="side" aria-label="Contents">
    <p class="mark"><b>~</b>alea</p>
    <p class="sub">Handbook: the guide and the reference.</p>
    <!--NAV-->
  </nav>
  <main>
    <details class="mobile-nav"><summary><b style="color:var(--accent)">~</b>alea Handbook · contents</summary><div id="mnav"></div></details>
    <article class="doc" id="guide"><!--GUIDE--></article>
    <article class="doc" id="reference"><!--REFERENCE--></article>
  </main>
</div>

<script>
(() => {
  // alea syntax highlighting, the same rules as the playground's editor.
  const KW = new Set(['use','work','let','field','pattern','constraint','render','output','repeat','event','choose','and','or','grow','then','for','in']);
  const PRIM = new Set(['meter','euclid','steps','chords','arp','lfo','orbit','cc','input','colours','colors','band','at','ease','keys','progress','sequence','blur','pixelate','edges','relief','posterize','film','vignette','bloom','chroma','paint','mosaic','place','overlay','drone','notes','texture','range','join','slice','reverse','sum','path','along','length','neighbours','neighbors','spread','nearby','circle','ring','rect','square','line','blob','stripes','waves','ripples','dots','checker','gradient','glow','clouds','grain','scatter','move','rotate','zoom','tile','mirror','kaleidoscope','warp','merge','overlap','cut','invert','threshold','text','picture','sin','cos','tan','abs','sqrt','exp','ln','floor','fract','sign','min','max','atan2','step','clamp','mix','smoothstep','distance','noise','mean','stddev','minimum','maximum','count','image','sound','video','sculpture','midi']);
  const DIST = new Set(['uniform','normal','beta','poisson','exponential','between','around']);
  const VARS = new Set(['x','y','t','i','n','pi','tau']);
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const TOKEN = /(\/\/.*|#.*)|("[^"\n]*"?)|(~~|~)|(\d[\d_]*(?:\.\d+)?)|([\p{L}_][\p{L}\p{N}_]*)/gu;
  const line = (l) => {
    let out = '', last = 0, m; TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(l))) {
      out += esc(l.slice(last, m.index));
      const [tok, com, str, draw, num, id] = m;
      let cls = com ? 'c' : str ? 's' : draw ? 'd' : num ? 'n' : '';
      if (id) {
        const rest = l.slice(m.index + tok.length);
        if (/^\s*:/.test(rest) && !KW.has(id)) cls = 'a';
        else if (KW.has(id)) cls = 'k';
        else if (/^\s*\(/.test(rest)) cls = DIST.has(id) ? 'd' : PRIM.has(id) ? 'p' : /^\p{Lu}/u.test(id) ? 'w' : '';
        else if (VARS.has(id)) cls = 'v';
      }
      out += cls ? `<span class="${cls}">${esc(tok)}</span>` : esc(tok);
      last = m.index + tok.length;
    }
    return out + esc(l.slice(last));
  };
  for (const code of document.querySelectorAll('code.language-alea')) {
    code.innerHTML = code.textContent.split('\n').map(line).join('\n');
  }

  // The same index, folded, on phones.
  document.getElementById('mnav').innerHTML = document.querySelector('.side').innerHTML.replace(/<p class="mark">.*?<\/p>\s*<p class="sub">.*?<\/p>/s, '');

  // Mark the section being read.
  const links = [...document.querySelectorAll('.side li a')];
  const byId = new Map(links.map((a) => [a.getAttribute('href').slice(1), a]));
  const seen = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      links.forEach((a) => a.classList.remove('here'));
      byId.get(e.target.id)?.classList.add('here');
    }
  }, { rootMargin: '0px 0px -75% 0px' });
  document.querySelectorAll('h2[id]').forEach((h) => byId.has(h.id) && seen.observe(h));
})();
</script>
