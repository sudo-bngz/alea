# A release, from a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# Builds the command line for macOS (Apple silicon + Intel in one binary),
# Linux (x86_64, arm64) and Windows, the plugin (VST3 + CLAP) for each, the
# playground and the handbook, then publishes them all on the GitHub release
# with their SHA-256 checksums.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  web:
    name: Playground and handbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the browser engine and the playground
        run: web/build.sh
      - name: Build the handbook (illustrated with the tour)
        run: |
          # the tour has videos: rendering them needs ffmpeg
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install markdown Pillow
          cargo build --release
          python3 web/handbook.py
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            web/dist/alea.wasm
            web/dist/playground.html
            web/dist/handbook.html

  cli:
    name: Command line (${{ matrix.name }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-latest, target: universal-apple-darwin }
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # the browser engine goes inside the binary, for `alea --web`
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web/dist
      - name: ALSA headers (live MIDI)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build (macOS, universal)
        if: matrix.name == 'macos'
        run: |
          cargo build --release --features midi --target aarch64-apple-darwin
          cargo build --release --features midi --target x86_64-apple-darwin
          mkdir -p out
          lipo -create -output out/alea \
            target/aarch64-apple-darwin/release/alea target/x86_64-apple-darwin/release/alea
          codesign --force --sign - out/alea
      - name: Build
        if: matrix.name != 'macos'
        shell: bash
        run: |
          cargo build --release --features midi --target ${{ matrix.target }}
          mkdir -p out
          cp target/${{ matrix.target }}/release/alea$([ "$RUNNER_OS" = Windows ] && echo .exe) out/
      - name: Package
        shell: bash
        run: |
          dir="alea-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          cp out/* LICENSE README.md "$dir/"
          cp -R examples "$dir/examples"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          # the archive only (a pattern like alea-*.* also caught the folder,
          # whose name has the version's dots)
          path: |
            alea-${{ env.TAG }}-${{ matrix.name }}.tar.gz
            alea-${{ env.TAG }}-${{ matrix.name }}.zip
          if-no-files-found: error

  plugin:
    name: Plugin (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-latest }
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: plugin-${{ matrix.name }}
      - name: X11, OpenGL and ALSA headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libgl1-mesa-dev
      - name: Build (macOS, universal)
        if: matrix.name == 'macos'
        working-directory: plugin
        run: |
          cargo xtask bundle-universal alea_plugin --profile plugin
          codesign --force --deep --sign - ../target/bundled/alea.vst3
          codesign --force --deep --sign - ../target/bundled/alea.clap
      - name: Build
        if: matrix.name != 'macos'
        working-directory: plugin
        run: cargo xtask bundle alea_plugin --profile plugin
      - name: Package
        shell: bash
        run: |
          dir="alea-plugin-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          cp -R target/bundled/alea.vst3 target/bundled/alea.clap "$dir/"
          cp plugin/LICENSE plugin/README.md "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            # zip keeps the bundles' structure for the Finder too
            zip -qry "$dir.zip" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.name }}
          path: alea-plugin-${{ env.TAG }}-${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [web, cli, plugin]
    # publish what was built, even if one platform failed
    if: ${{ !cancelled() && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          mkdir release
          # only the files meant for the release, whatever else came along
          find artifacts -maxdepth 2 -type f \( -name 'alea-*.tar.gz' -o -name 'alea-*.zip' \) -exec mv {} release/ \;
          mv artifacts/playground.html "release/alea-$TAG-playground.html"
          mv artifacts/handbook.html "release/alea-$TAG-handbook.html"
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: alea ${{ env.TAG }}
          generate_release_notes: true
          files: release/*

  homebrew:
    name: Update the Homebrew tap
    needs: publish
    # needs a HOMEBREW_TAP_TOKEN secret: a token that can push to sudo-bngz/homebrew-tap
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for the token
        id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Write the formula and push it to the tap
        if: steps.token.outputs.present == 'yes'
        env:
          # the release is read with the workflow's own token; the tap's token
          # can only write to the tap
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/sudo-bngz/homebrew-tap.git" tap
          mkdir -p tap/Formula
          python3 packaging/homebrew/formula.py "$TAG" SHA256SUMS.txt > tap/Formula/alea.rb
          cd tap
          git config user.name "alea release"
          git config user.email "alea-release@users.noreply.github.com"
          git add Formula/alea.rb
          git commit -m "alea $TAG" && git push || echo "the formula is already up to date"
